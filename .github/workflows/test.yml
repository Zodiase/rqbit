name: Run tests

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace rqbit-webui
      - run: npm run build --workspace rqbit

  check-rust-compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust_version: ["1.94", "1.97"]
    steps:
      - name: rustup toolchain install ${{ matrix.rust_version }}
        run: |
          rustup toolchain install ${{ matrix.rust_version }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - run: rustup override set ${{ matrix.rust_version }}

      - run: rustup component add rustfmt clippy

      - run: python3 scripts/test_ci_security.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace rqbit-webui

      - name: cargo check
        run: cargo check

      - name: fmt check
        run: cargo fmt --all -- --check

      - name: clippy check
        run: cargo clippy --all-targets

  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - run: rustup toolchain install stable --profile minimal

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace rqbit-webui

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1

      - name: Run tests
        if: ${{ matrix.os == 'windows-latest' }}
        run: cargo test --workspace

      - name: Run tests
        if: ${{ matrix.os == 'macos-latest' }}
        run: ulimit -n unlimited && cargo test --workspace

      - name: Run tests
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: cargo test
